[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-paper-agent"
version = "0.1.0"
description = "Agentic PDF reader with original-page highlights, paper-grounded concept research, math walkthroughs, skills, memory, and evaluation."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{name = "Arihant Tripathi"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "deepagents>=0.2.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-ollama>=1.0.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.0.0",
    "pymupdf>=1.24.0",
    "pyarrow>=15.0.0",
    "sympy>=1.13,<2",
    "antlr4-python3-runtime>=4.11,<4.12",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
observability = [
    "langfuse>=4.7,<5",
]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/Siris2314/deep-paper-reader"
Repository = "https://github.com/Siris2314/deep-paper-reader.git"
Issues = "https://github.com/Siris2314/deep-paper-reader/issues"

[project.scripts]
paper-agent = "paper_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["paper_report", "paper_reports", "uploaded_papers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
