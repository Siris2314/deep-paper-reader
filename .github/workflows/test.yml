name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m ruff check src ui scripts tests
      - run: python -m ruff format --check src ui scripts tests
      - run: python -m pytest -q
      - name: Cross-layout PDF and OCR regression gate
        env:
          PAPER_RETRIEVAL_EMBEDDING_PROVIDER: "off"
          PAPER_OCR_ENABLED: "true"
        run: python scripts/evaluate_reader_regression.py --require-pass
      - run: python -m build
